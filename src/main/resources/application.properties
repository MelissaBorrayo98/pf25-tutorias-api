# Base de datos PostgreSQL (crearla con DATABASE/01_crear_base_de_datos.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/pf25_tutorias_db
spring.datasource.username=${DB_USER:postgres}
# Cambie 'cambiar_password' por su contraseña, o defina la variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
